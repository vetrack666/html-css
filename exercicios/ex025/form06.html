<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Exemplos de formulário</h1>
    <form action="cadastro.php" method="post">
        <p>
            <label for="icol">Cor: </label>
            <input type="color" name="col" id="icol">
        </p>
        <p>
            <label for="isat">Nível de satisfação: </label>
            <input type="range" name="sat" id="isat" max="5" min="1" value="2">
        </p>
        <p>
            <label for="ifot">Foto de perfil: </label>
            <input type="file" name="fot" id="ifot">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
