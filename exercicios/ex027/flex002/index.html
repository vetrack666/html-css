<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row wrap;
        }

        div.item {
            background-color: aquamarine;
            border: 1px solid black;
            text-align: center;
            flex: auto;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Exemplode bloco A</div>
        <div class="item">Exemplode bloco B</div>
        <div class="item">Exemplode bloco C</div>
        <div class="item">Exemplode bloco D</div>
        <div class="item">Exemplode bloco E</div>
        <div class="item">Exemplode bloco F</div>
        <div class="item">Exemplode bloco G</div>
    </div>
</body>
</html>
